<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>::: Awesome Todo List :::</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <script src="./app.js"></script>
</head>

<body class="bg-body-secondary">
    <header class="py-3 shadow bg-body-tertiary">
        <div class="container d-flex gap-3 align-items-center">
            <img src="./assets/to-do-list.png" height="50"
                style="position:relative; top: -3px; transform: rotate(-10deg);" alt="Todo app icon">
            <h1>
                Awesome Todo List
            </h1>
        </div>
    </header>
    <div class="container my-5">
        <div class="mx-auto">
            <div class="card shadow">
                <div class="card-header">
                    <form class="py-2 d-flex" autocomplete="off"
                        onsubmit="event.preventDefault(); addTodoToState(todoItemValue); this.reset();">
                        <input type="text" onchange="todoItemValue=this.value" class="form-control me-2" required
                            id="newTodoInput" name="todoItem">
                        <button type="submit" class="btn btn-primary">Add</button>
                    </form>
                </div>
                <div class="card-body">
                    <h5>Pending</h5>
                    <ul class="list-group list-group-flush" id="pending">
                    </ul>
                    <hr>
                    <h5>Done</h5>
                    <ul class="list-group list-group-flush" id="done" >
                    </ul>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
